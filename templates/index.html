<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataSage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #7c8cf8;
      flex: 1;
      letter-spacing: -0.01em;
    }
    header h1 span { color: #94a3b8; font-weight: 400; font-size: 0.8rem; margin-left: 8px; }
    .btn {
      padding: 6px 14px;
      border: 1px solid #2d3148;
      background: #1e2235;
      color: #94a3b8;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn:hover { background: #252a40; color: #e2e8f0; border-color: #3d4468; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }

    /* ── Message groups ── */
    .message-group {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .message-group.user { align-self: flex-end; align-items: flex-end; }
    .message-group.agent { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.65;
      font-size: 0.91rem;
      word-break: break-word;
    }
    .user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .agent .bubble {
      background: #1e2235;
      border: 1px solid #2d3148;
      border-bottom-left-radius: 4px;
    }
    .error-bubble {
      background: #2d1420 !important;
      border-color: #7f1d1d !important;
      color: #fca5a5 !important;
    }

    /* ── Tool tags ── */
    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }
    .tool-tag {
      font-size: 0.7rem;
      padding: 2px 9px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: default;
    }
    .tool-analyze  { background: #1e3a5f; color: #60a5fa; }
    .tool-execute  { background: #2d1f3d; color: #a78bfa; }
    .tool-list     { background: #1a3028; color: #34d399; }
    .tool-memory   { background: #3b2000; color: #fb923c; }
    .tool-default  { background: #1f2937; color: #94a3b8; }

    /* ── Markdown styles inside agent bubble ── */
    .bubble h1, .bubble h2, .bubble h3 {
      margin: 0.75em 0 0.35em;
      color: #c7d2fe;
      line-height: 1.3;
    }
    .bubble h1 { font-size: 1.1rem; }
    .bubble h2 { font-size: 1.0rem; }
    .bubble h3 { font-size: 0.95rem; }
    .bubble p  { margin: 0.35em 0; }
    .bubble ul, .bubble ol { padding-left: 1.4em; margin: 0.35em 0; }
    .bubble li { margin: 0.2em 0; }
    .bubble code:not(pre code) {
      background: #0d1117;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.86em;
      color: #f472b6;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .bubble pre {
      margin: 0.6em 0;
      border-radius: 9px;
      overflow-x: auto;
      border: 1px solid #2d3148;
    }
    .bubble pre code {
      font-size: 0.8rem;
      padding: 14px 16px;
      display: block;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }
    .bubble table {
      border-collapse: collapse;
      font-size: 0.84rem;
      margin: 0.5em 0;
      width: 100%;
    }
    .bubble th, .bubble td {
      border: 1px solid #2d3148;
      padding: 6px 10px;
      text-align: left;
    }
    .bubble th { background: #161926; color: #94a3b8; font-weight: 600; }
    .bubble strong { color: #e2e8f0; }
    .bubble em { color: #94a3b8; }
    .bubble blockquote {
      border-left: 3px solid #4f46e5;
      padding-left: 12px;
      color: #94a3b8;
      font-style: italic;
      margin: 0.4em 0;
    }
    .bubble hr { border: none; border-top: 1px solid #2d3148; margin: 0.8em 0; }
    .bubble a { color: #7c8cf8; }

    /* ── Plot images ── */
    .plot-container { margin-top: 10px; }
    .plot-img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #2d3148;
      display: block;
      margin-top: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .plot-img:hover { opacity: 0.9; }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

    /* ── Loading dots ── */
    .loading-dots {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: #1e2235;
      border: 1px solid #2d3148;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7c8cf8;
      animation: pulse 1.4s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.65); opacity: 0.35; }
      40%            { transform: scale(1);    opacity: 1;    }
    }

    /* ── Input bar ── */
    #input-bar {
      padding: 12px 20px;
      background: #1a1d27;
      border-top: 1px solid #2d3148;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background: #1e2235;
      border: 1px solid #2d3148;
      border-radius: 10px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 0.91rem;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      font-family: inherit;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    #user-input::placeholder { color: #4b5268; }
    #user-input:focus { border-color: #4f46e5; }
    #send-btn {
      height: 44px;
      padding: 0 20px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { background: #6366f1; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }
    #modal-box {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 14px;
      padding: 24px;
      min-width: 300px;
      max-width: 420px;
      width: 90%;
    }
    #modal-box h2 {
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: #c7d2fe;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #2d3148;
      font-size: 0.87rem;
    }
    .stat-row:last-of-type { border: none; }
    .stat-label { color: #94a3b8; }
    .stat-value { color: #e2e8f0; font-weight: 600; }
    #modal-close-wrap { margin-top: 18px; text-align: right; }
  </style>
</head>
<body>

<header>
  <h1>DataSage <span>Data Science Agent</span></h1>
  <button class="btn" id="new-btn">New Session</button>
  <button class="btn" id="memory-btn">Memory</button>
</header>

<div id="messages"></div>

<div id="input-bar">
  <textarea id="user-input" placeholder="Ask DataSage anything… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
  <button id="send-btn">Send</button>
</div>

<!-- Lightbox for full-size plot view -->
<div id="lightbox"><img id="lightbox-img" src="" alt="plot"></div>

<div id="modal-overlay">
  <div id="modal-box">
    <h2>Memory</h2>
    <div id="modal-content"></div>
    <div id="modal-close-wrap">
      <button class="btn" id="modal-close">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  // ── marked config ────────────────────────────────────────────────────────
  marked.setOptions({
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    },
    breaks: true,
    gfm: true,
  });

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");

  // ── Tool tag colour ──────────────────────────────────────────────────────
  function toolClass(name) {
    if (name.startsWith("analyze")) return "tool-analyze";
    if (name.startsWith("execute")) return "tool-execute";
    if (name.startsWith("list"))    return "tool-list";
    if (name.includes("memory"))    return "tool-memory";
    return "tool-default";
  }

  // ── Append a message bubble ──────────────────────────────────────────────
  function appendMessage(role, text, tools = [], isError = false, plots = []) {
    const group = document.createElement("div");
    group.className = `message-group ${role}`;

    if (role === "agent" && tools.length > 0) {
      const tagsDiv = document.createElement("div");
      tagsDiv.className = "tool-tags";
      tools.forEach(t => {
        const tag = document.createElement("span");
        tag.className = `tool-tag ${toolClass(t.name)}`;
        tag.textContent = t.name;
        tag.title = t.input_preview;
        tagsDiv.appendChild(tag);
      });
      group.appendChild(tagsDiv);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error-bubble" : "");
    bubble.innerHTML = role === "agent" ? marked.parse(text) : escapeHtml(text);

    // Render any plots below the text
    if (plots.length > 0) {
      const plotContainer = document.createElement("div");
      plotContainer.className = "plot-container";
      plots.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        img.className = "plot-img";
        img.alt = "Generated plot";
        img.addEventListener("click", () => openLightbox(url));
        plotContainer.appendChild(img);
      });
      bubble.appendChild(plotContainer);
    }

    group.appendChild(bubble);
    messagesEl.appendChild(group);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return group;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");
  }

  // ── Loading indicator ────────────────────────────────────────────────────
  function showLoading() {
    const group = document.createElement("div");
    group.className = "message-group agent";
    group.id = "loading-indicator";
    const dots = document.createElement("div");
    dots.className = "loading-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    group.appendChild(dots);
    messagesEl.appendChild(group);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideLoading() {
    document.getElementById("loading-indicator")?.remove();
  }

  // ── Send ─────────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    appendMessage("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;
    inputEl.disabled = true;
    showLoading();

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      hideLoading();

      if (data.error) {
        appendMessage("agent", `**Error:** ${data.error}`, [], true);
      } else {
        appendMessage("agent", data.response, data.tools || [], false, data.plots || []);
      }
    } catch (err) {
      hideLoading();
      appendMessage("agent", `**Network error:** ${err.message}`, [], true);
    } finally {
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  // ── Keyboard ─────────────────────────────────────────────────────────────
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });
  sendBtn.addEventListener("click", sendMessage);

  // ── New session ──────────────────────────────────────────────────────────
  document.getElementById("new-btn").addEventListener("click", async () => {
    const res  = await fetch("/new", { method: "POST" });
    const data = await res.json();
    messagesEl.innerHTML = "";
    appendMessage("agent",
      `Session reset (\`${data.session_id}\`). How can I help you today?`
    );
  });

  // ── Memory modal ─────────────────────────────────────────────────────────
  const modalOverlay = document.getElementById("modal-overlay");

  document.getElementById("memory-btn").addEventListener("click", async () => {
    modalOverlay.classList.add("open");
    document.getElementById("modal-content").innerHTML =
      '<div class="stat-row"><span class="stat-label">Loading…</span></div>';
    try {
      const data = await (await fetch("/memory")).json();
      const rows = [
        ["Total memories", data.total_memories],
        ["Sessions saved", data.sessions],
      ];
      Object.entries(data.by_category || {}).sort().forEach(([k, v]) => {
        rows.push([`↳ ${k}`, v]);
      });
      document.getElementById("modal-content").innerHTML = rows
        .map(([k, v]) =>
          `<div class="stat-row">` +
          `<span class="stat-label">${k}</span>` +
          `<span class="stat-value">${v}</span></div>`
        ).join("");
    } catch {
      document.getElementById("modal-content").innerHTML =
        '<div class="stat-row"><span class="stat-label">Failed to load.</span></div>';
    }
  });

  document.getElementById("modal-close").addEventListener("click", () =>
    modalOverlay.classList.remove("open")
  );
  modalOverlay.addEventListener("click", e => {
    if (e.target === modalOverlay) modalOverlay.classList.remove("open");
  });

  // ── Lightbox ─────────────────────────────────────────────────────────────
  const lightbox    = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  function openLightbox(url) {
    lightboxImg.src = url;
    lightbox.classList.add("open");
  }
  lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") lightbox.classList.remove("open");
  });

  // ── Welcome ──────────────────────────────────────────────────────────────
  appendMessage("agent",
    "Hello! I'm **DataSage**, your data science mentor.\n\n" +
    "I can help you explore datasets, write and run Python code, explain " +
    "statistical concepts, and guide you through building models.\n\n" +
    "Try asking:\n" +
    "- *What data files do I have?*\n" +
    "- *Analyse data/diabetes.csv*\n" +
    "- *How do I handle missing values in pandas?*"
  );
</script>
</body>
</html>
